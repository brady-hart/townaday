<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Town-A-Day | Daily Geo Game</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
    }   
    #map {
      height: 100vh;
    }
  </style>
</head>


<body>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.4.0/axios.min.js"></script>
    
    <div id="map" ></div>
    
    <div id="main">
        <img id="game-logo" class="game-logo-small" src="./assets/logo_dark.png"/>
        <button id="about-creator-btn">Copyright © 2026 Brady Hart LLC. All rights reserved.</button>

        <div id="screen-darkener" class="screen-darkener"></div>

        <div id="start-screen">
            <!--Town a day.com, Town For Today, Settlementary, Settlementia, Settlementalist, -->
            <img id="game-logo" class="game-logo" src="./assets/logo.png"/>
            <span id="instructions-1" class="instructions">Guess the town of the day in 7 tries or less.</span>
            <span id="instructions-2" class="instructions">Even a wrong guess can teach you something.</span>
            <button id="close-btn-1" class="close-btn">X</button>
        </div>
        
        <div id="target-toolbar">
            <div id="guessmarker-bar">
                <img id="guessmarker-1" class="guessmarker" src="assets/ui_guessmarker_blank.png" alt="blank guessmarker">
                <img id="guessmarker-2" class="guessmarker" src="assets/ui_guessmarker_blank.png" alt="blank guessmarker">
                <img id="guessmarker-3" class="guessmarker" src="assets/ui_guessmarker_blank.png" alt="blank guessmarker">
                <img id="guessmarker-4" class="guessmarker" src="assets/ui_guessmarker_blank.png" alt="blank guessmarker">
                <img id="guessmarker-5" class="guessmarker" src="assets/ui_guessmarker_blank.png" alt="blank guessmarker">
                <img id="guessmarker-6" class="guessmarker" src="assets/ui_guessmarker_blank.png" alt="blank guessmarker">
                <img id="guessmarker-7" class="guessmarker" src="assets/ui_guessmarker_blank.png" alt="blank guessmarker">
            </div>
            <div id="target-traits-grid" class="target-traits-grid">
                <button id="climate-filter-btn" class="filter-btn climate-filter-btn" data-filter="climate" style="transform: translate(0, 10px);"></button>
                <img id="target-climate-card" class="trait-card" src="assets/cards/card_climate_blank.png" alt="climate blank card">
                <img id="target-height-card" class="trait-card" src="assets/cards/card_height_blank.png" alt="elevation blank card">
                <button id="height-filter-btn" class="filter-btn" style="transform: translate(0, 10px);"></button>
                <button id="language-filter-btn" class="filter-btn"></button>
                <img id="target-language-card" class="trait-card" src="assets/cards/card_language_blank.png" alt="language blank card">
                <img id="target-build-card" class="trait-card" src="assets/cards/card_build_blank.png" alt="build blank card">
                <button id="build-filter-btn" class="filter-btn"></button>
                
                <img id="target-pin" class="pin-icon" src="assets/pins/pin_blank.png" alt="Blank pin">
            </div>
            <button id="size-filter-btn" class="filter-btn" style="transform: translate(0, -8px);"></button>
        </div>

        <div id="selected-toolbar">
            <img id="city-photo" class="city-photo" src="">
            <span id="city-name" class="city-name">City Name</span>
            <button id="wiki-link">Learn more...</button>
            <div id="selected-traits-grid">
                <img id="selected-climate-card" class="trait-card" src="assets/cards/card_climate_blank.png">
                <img id="selected-height-card" class="trait-card" src="assets/cards/card_height_blank.png">
                <img id="selected-language-card" class="trait-card" src="assets/cards/card_language_blank.png">
                <img id="selected-build-card" class="trait-card" src="assets/cards/card_build_blank.png">
                <img id="selected-pin" class="pin-icon" src="assets/pins/pin_blank.png">
            </div>
            <div id="buttons-container">
                <button id="guess-btn" class="guess-btn">GUESS</button>
                <button id="close-btn-2" class="close-btn">X</button>
            </div>
        </div>

        <div id="end-screen-darkener" class="screen-darkener"></div>

        <div id="failure-screen">
            <span id="failure-title" class="card-title">Tough luck...</span>
            <span id="failure-message" class="instructions"></span>
            <img id="target-photo" class="city-photo" src="">
            <span id="failure-cta" class="instructions">Try again?</span>
            <button id="play-again-btn" class="guess-btn">PLAY AGAIN</button>
        </div>

        <div id="victory-screen">
            <span id="victory-title" class="card-title">Well done!</span>
            <span id="victory-message" class="instructions"></span>
            <img id="found-target-photo" class="city-photo" src="">
            <span id="victory-cta" class="instructions">Get your shareable graphic below!</span>
            <button id="graphic-btn" class="close-btn">NEXT</button>
        </div>

        <div id="share-screen">
            <img id="share-screen-game-logo" class="game-logo-small" src="./assets/logo.png"/>
            <div id="share-guesses-container"></div>
            <span id="game-url" class="instructions-small">TownADay.com</span>
        </div>

        
    </div>


<!--CONTROLS-->
    <style>
        .screen-darkener {
            display: flex;
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.479);
            z-index: 0;
        }
        #start-screen {
            position: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            top: 30%;
            transform: translate(0%, -30%);
            width: 330px;
            border-radius: 30px;
            padding: 50px;
            background: linear-gradient(to right, #212128, #212128);
            box-shadow: 6px 8px 20px #0000007d;
            gap: 45px;
        }
        #failure-screen, #victory-screen {
            position: fixed;
            display: none;
            flex-direction: column;
            align-items: center;
            top: 30%;
            transform: translate(0%, -30%);
            width: 400px;
            height: auto;
            border-radius: 30px;
            padding: 20px;
            background: linear-gradient(to right, #212128, #212128);
            box-shadow: 6px 8px 20px #0000007d;
            gap: 20px;
        }
        #failure-screen {
            background: #949494;
        }
        #share-screen {
            position: fixed;
            display: none;
            flex-direction: column;
            align-items: center;
            top: 30%;
            transform: translate(0%, -30%);
            width: auto;
            height: auto;
            border-radius: 30px;
            padding: 20px;
            background: linear-gradient(to right, #212128, #212128);
            box-shadow: 6px 8px 20px #0000007d;
            gap: 0px;
        }
        @keyframes victory-breathe {
            0%   { transform: scale(1); }
            50%  { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .game-logo-small {
            width: 200px;
            height: auto;
            margin-top: 15px;
        }
        #share-guesses-container {
            transform: scale(.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0px;
            width: 330px;
            padding: 0px;
            border-radius: none;
            margin: 0;
        }
        .victory-idle {
            animation: victory-breathe 2.5s ease-in-out infinite;
        }

        .game-logo {
            width: 250px;
            height: auto;
        }
        .card-title {
            display: flex;
            text-align: center;
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-size: 36px;
            font-weight: 700;
            color: #f4e9e9;
        }
        .instructions {
            text-align: center;
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-size: 24px;
            font-weight: 200;
            color: #f4e9e9;
            padding: 0px 0px 0px 0px;
        }
        .instructions-small {
            text-align: center;
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-size: 18px;
            font-weight: 200;
            color: #b2adad;
            padding: 0px 0px 0px 0px;
            margin-bottom: 15px;
        }
        #target-toolbar {
            position: fixed;
            display: flex;
            bottom: 15px;
            flex-direction: column;
            align-items: center;
            /* background: linear-gradient(to right, #3a404f, #b3bcb4); /* Set your gradient colors */
            background: linear-gradient(to right, #e4e1e1, #e4e1e1); /* Set your gradient colors */
            border-radius: 25px;
            padding: 5px;
            box-shadow: 6px 8px 20px #0000007d;
            z-index: 10;
        }
        #selected-toolbar {
            display: none;
            flex-direction: column;
            align-items: center;
            transform: translate(0%, 35%);
            border-radius: 30px;
            padding: 5px;
            background: linear-gradient(to right, #212128, #212128);
            box-shadow: 6px 8px 20px #0000007d;
            z-index: 10;
        }
        #guessmarker-bar {
            display: flex;
            gap: 0px;
        }
        .guessmarker {
            width: 40px;
            height: auto;
        }
        .target-traits-grid {
            position: relative;        /* for the pin overlay */
            display: grid;
            grid-template-columns: repeat(4, auto);
            grid-template-rows: repeat(4, auto);
            gap: 3px;
            justify-items: center;
        }
        #selected-traits-grid {
            position: relative;        /* for the pin overlay */
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, auto);
            gap: 3px;
            justify-items: center;
        }
        .share-traits-grid {
            display: grid;
            grid-template-columns: repeat(2, auto);
            gap: 3px;
            transform: scale(1);
            justify-items: center;
            transform-origin: top center;
            opacity: 1;
            margin-bottom: -10px;
        }
        @keyframes guess-pop {
            from {
                opacity: 0;
                transform: scale(0.85);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        .city-name {
            position: absolute;
            top: 5px;
            font-family: Georgia, times, serif;
            font-size: 21px;
            font-weight: 700;
            background-color: #212128;
            border-radius: 30px;
            color: #f4e9e9;
            padding: 5px 8px 5px 8px;
        }
        #wiki-link {
            position: absolute;
            display: none;
            top: 35px;
            font-family: Georgia, times, serif;
            font-size: 14px;
            font-weight: 400;
            border: none;
            outline: none;
            background: none;
            background-color: none;
            color: #f4e9e9;
            text-shadow: 0px 0px 5px black;
            padding: 5px;
        }
        #wiki-link:hover {
            position: absolute;
            display: block;
            top: 35px;
            font-family: Georgia, times, serif;
            font-size: 14px;
            font-weight: 400;
            background-color: none;
            color: #0059ff;
            text-shadow: none;
            padding: 5px;
        }
        .city-photo {
            width: 100%;
            height: 200px;
            object-fit: cover;
            object-position: center;
            border-radius: 25px;
        }
        .card-wrapper {
            display: flex;
            flex-direction: row;
            gap: 0px;
        }
        .trait-card {
            width: 100%;
            max-width: 200px;
            height: auto;
        }
        .pin-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;        /* higher than everything else */
            pointer-events: none; /* optional: clicks pass through */
            height: 100px;
        }
        .feature-name-label {
            font-size: 18px;
            font-family: Helvetica, Arial, sans-serif;
            font-weight: 400;
            background: none;
            border: none;
            padding: 0;
            text-align: center;
            pointer-events: none;
            color: #3a404f;
            box-shadow: none;
            text-shadow: 0px 0px 5px white;
        }
        #map {
            position: relative;
            width:  100%;
            height: 100vh; /* full screen height */
            z-index: 0;
        }
        </style>

<!--MAIN TOOLBAR-->

    <!--REPURPOSED STUFF-->
    <style>

  <script>
    // Initialize the map
    //setView([32.8872, 13.1914], 3); // Centered on world (Tripoli)
    const map = L.map('map').setView([32.8872, 13.1914], 3); // Centered on Tripoli

    // Add OpenStreetMap tiles
    // Other map styles: 
    // default: https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png
    // light: https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png
    // dark: https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png
    // light no labels: https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png
    // dark no labels: https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png
    // topo: https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png
    // esri physical: https://server.arcgisonline.com/ArcGIS/rest/services/World_Physical_Map/MapServer/tile/{z}/{y}/{x}
    
    // NEEDS API KEY:
    // Stamen terrain: https://tiles.stadiamaps.com/tiles/stamen_terrain_background/{z}/{x}/{y}{r}.{ext}
    // Stamen watercolor: https://tiles.stadiamaps.com/tiles/stamen_watercolor/{z}/{x}/{y}.{ext}

    var Esri_WorldImagery = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
	    attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
    });

    var Esri_WorldTerrain = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Terrain_Base/MapServer/tile/{z}/{y}/{x}', {
	    attribution: 'Tiles &copy; Esri &mdash; Source: USGS, Esri, TANA, DeLorme, and NPS',
	    maxZoom: 13
    });

    var Esri_WorldShadedRelief = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Shaded_Relief/MapServer/tile/{z}/{y}/{x}', {
	    attribution: 'Tiles &copy; Esri &mdash; Source: Esri',
	    maxZoom: 13
    });

    var Esri_WorldPhysical = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Physical_Map/MapServer/tile/{z}/{y}/{x}', {
	    attribution: 'Tiles &copy; Esri &mdash; Source: US National Park Service',
	    maxZoom: 8
    });

    var Esri_OceanBasemap = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Base/MapServer/tile/{z}/{y}/{x}', {
	    attribution: 'Tiles &copy; Esri &mdash; Sources: GEBCO, NOAA, CHS, OSU, UNH, CSUMB, National Geographic, DeLorme, NAVTEQ, and Esri',
	    maxZoom: 13
    });

    var NASAGIBS_ViirsEarthAtNight2012 = L.tileLayer('https://map1.vis.earthdata.nasa.gov/wmts-webmerc/VIIRS_CityLights_2012/default/{time}/{tilematrixset}{maxZoom}/{z}/{y}/{x}.{format}', {
	    attribution: 'Imagery provided by services from the Global Imagery Browse Services (GIBS), operated by the NASA/GSFC/Earth Science Data and Information System (<a href="https://earthdata.nasa.gov">ESDIS</a>) with funding provided by NASA/HQ.',
	    bounds: [[-85.0511287776, -179.999999975], [85.0511287776, 179.999999975]],
	    minZoom: 1,
	    maxZoom: 8,
	    format: 'jpg',
	    time: '',
	    tilematrixset: 'GoogleMapsCompatible_Level'
    });

    var OSM_LightNoLabels = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
        attribution: '© OpenStreetMap contributors'
    })

    var OSM_DarkNoLabels = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png', {
        attribution: '© OpenStreetMap contributors'
    })
    
    OSM_LightNoLabels.addTo(map);

    // SIZE NORMAL (20)                           SIZE SMALL (15)                                 SIZE X-SMALL (10)                               SIZE XX-SMALL (7)                             SIZE XXX-SMALL (5)
    // (icon height - 4)                          (small icon height - 4)                         (small icon height - 4)                         (small icon height - 4)                       (small icon height - 4)
    const iconSizeX = 100;                        const smallIconSizeX = 100;                     const xSmallIconSizeX = 100;                     const xxSmallIconSizeX = 100;                  const xxxSmallIconSizeX = 100;
    const iconSizeY = 180;                        const smallIconSizeY = 164;                     const xSmallIconSizeY = 140;                     const xxSmallIconSizeY = 127;                  const xxxSmallIconSizeY = 114;
    
    const anchorX = 54;                                                                           const xSmallAnchorX = 36;                       const xxSmallAnchorX = 36;
    
    const divisionFactor = 1.5;

    // ICONS (anchor y coordinate has been lowered by 4px)
    // UTILITY and BASE
    const blankIcon = L.icon({
        iconUrl: `./assets/pins/pin_blank.png`,
        iconSize: [iconSizeX/divisionFactor, iconSizeY/divisionFactor],
        iconAnchor: [anchorX/divisionFactor, iconSizeY/divisionFactor],
        className: `custom-icon`
    })
    const icon5 = L.icon({
        iconUrl: `./assets/pins/pin_5.png`,
        iconSize: [xxxSmallIconSizeX/divisionFactor, xxxSmallIconSizeY/divisionFactor],
        iconAnchor: [anchorX/divisionFactor, xxxSmallIconSizeY/divisionFactor],
        className: `custom-icon`
    })
    const icon5Hover = L.icon({
        iconUrl: `./assets/pins/pin_5_hover.png`,
        iconSize: [xxxSmallIconSizeX/divisionFactor, xxxSmallIconSizeY/divisionFactor],
        iconAnchor: [anchorX/divisionFactor, xxxSmallIconSizeY/divisionFactor],
        className: `custom-icon`
    })
    const icon7 = L.icon({
        iconUrl: `./assets/pins/pin_7.png`,
        iconSize: [xxSmallIconSizeX/divisionFactor, xxSmallIconSizeY/divisionFactor],
        iconAnchor: [anchorX/divisionFactor, xxSmallIconSizeY/divisionFactor],
        className: `custom-icon`
    })
    const icon7Hover = L.icon({
        iconUrl: `./assets/pins/pin_7_hover.png`,
        iconSize: [xxSmallIconSizeX/divisionFactor, xxSmallIconSizeY/divisionFactor],
        iconAnchor: [anchorX/divisionFactor, xxSmallIconSizeY/divisionFactor],
        className: `custom-icon`
    })
    const icon10 = L.icon({
        iconUrl: `./assets/pins/pin_10.png`,
        iconSize: [xSmallIconSizeX/divisionFactor, xSmallIconSizeY/divisionFactor],
        iconAnchor: [anchorX/divisionFactor, xSmallIconSizeY/divisionFactor],
        className: `custom-icon`
    })
    const icon10Hover = L.icon({
        iconUrl: `./assets/pins/pin_10_hover.png`,
        iconSize: [xSmallIconSizeX/divisionFactor, xSmallIconSizeY/divisionFactor],
        iconAnchor: [anchorX/divisionFactor, xSmallIconSizeY/divisionFactor],
        className: `custom-icon`
    })
    const icon15 = L.icon({
        iconUrl: `./assets/pins/pin_15.png`,
        iconSize: [smallIconSizeX/divisionFactor, smallIconSizeY/divisionFactor],
        iconAnchor: [anchorX/divisionFactor, smallIconSizeY/divisionFactor],
        className: `custom-icon`
    })
    const icon15Hover = L.icon({
        iconUrl: `./assets/pins/pin_15_hover.png`,
        iconSize: [smallIconSizeX/divisionFactor, smallIconSizeY/divisionFactor],
        iconAnchor: [anchorX/divisionFactor, smallIconSizeY/divisionFactor],
        className: `custom-icon`

    // make guess function
    function makeGuess() {
        // mark city as guessed
        const layer = cityLayers[activeCityId];
        if (!layer) {
            console.log('no layer')
            return
        }
        layer.feature.properties.guessed = 'true';
        layer.setIcon(iconGuessed)


        // snapshot the current selected traits
        const original = document.getElementById('selected-traits-grid');
        const clone = original.cloneNode(true);

        // important cleanup
        clone.removeAttribute('id');
        clone.classList.add('share-traits-grid');

        // set target cards if any matches
        if (targetClimate === selectedClimate) {
            climateIsMatched = true;
            targetClimateCard.src = climateCards[selectedClimate]
            climateFilterBtn.disabled = false;
        }
        if (targetHeight === selectedHeight) {
            heightIsMatched = true;
            targetHeightCard.src = heightCards[selectedHeight]
            heightFilterBtn.disabled = false;
        }
        if (targetLanguage === selectedLanguage) {
            languageIsMatched = true;
            targetLanguageCard.src = languageCards[selectedLanguage]
            languageFilterBtn.disabled = false;
        }
        if (targetBuild === selectedBuild) {
            buildIsMatched = true;
            targetBuildCard.src = buildCards[selectedBuild]
            buildFilterBtn.disabled = false;
        }
        if (targetSize === selectedSize) {
            sizeIsMatched = true;
            targetPin.src = selectedPin.src;
            sizeFilterBtn.disabled = false;
        }

        // Hide everything
        selectedToolbar.style.display = 'none';
        screenDarkener.style.display = 'none';    

        // count the guess
        guessesMade++
        console.log('Guesses made:', guessesMade)

        // update the guess marker (1-7)
        const marker = document.getElementById(`guessmarker-${guessesMade}`);
        if (marker) {
            marker.src = `./assets/ui_guessmarker.png`;
        }

        // Check for victory, can happen on any guess
        const allTraitsMatched =
            climateIsMatched &&
            heightIsMatched &&
            languageIsMatched &&
            buildIsMatched &&
            sizeIsMatched;

        if (!allTraitsMatched) {
            guessGrids.push(clone);
        }

        if (allTraitsMatched) {
            triggerGameOverVictory();
            return;
        }

        // Failure ONLY happens on final guess
        if (guessesMade >= 7) {
            triggerGameOverFailure();
        }

        return
    }

    function applyFilters() {
        allCityMarkers.forEach(layer => {
            const props = layer.feature.properties;
            let visible = true;

            if (activeFilters.size &&
                normalize(props.size_tag) !== activeFilters.size) {
            visible = false;
            }

            if (activeFilters.climate &&
                normalize(props.climate_tag) !== activeFilters.climate) {
            visible = false;
            }

            if (activeFilters.height &&
                normalize(props.elevation_tag) !== activeFilters.height) {
            visible = false;
            }

            if (activeFilters.language &&
                normalize(props.language_tag) !== activeFilters.language) {
            visible = false;
            }

            if (activeFilters.build &&
                normalize(props.build_tag) !== activeFilters.build) {
            visible = false;
            }

            if (visible) {
            map.addLayer(layer);
            } else {
            map.removeLayer(layer);
            }
        });
    }

    function normalize(value) {
    return value
        ?.toLowerCase()
        .replace(/[^a-z0-9]/g, '');
    }

    function createShareGrid(cardSet, extraClass = '') {
        const grid = document.createElement('div');
        grid.className = `share-traits-grid ${extraClass}`;

        grid.innerHTML = `
            <img class="trait-card" src="${cardSet.climate}">
            <img class="trait-card" src="${cardSet.height}">
            <img class="trait-card" src="${cardSet.language}">
            <img class="trait-card" src="${cardSet.build}">
            <img class="pin-icon" src="${cardSet.size}">
        `;

        return grid;
    }

    
    async function triggerGameOverVictory() {        
        // hide and show stuff
        document.getElementById("target-toolbar").style.display = 'none';
        document.getElementById("end-screen-darkener").style.display = 'block';
        const victoryScreen = document.getElementById('victory-screen');
            victoryScreen.style.display = 'flex';
        // animate victory phrase
        const victoryTitle = document.getElementById('victory-title');
            victoryTitle.classList.add('victory-idle');

        // Set target name in the victory message
        const victoryMessage = document.getElementById('victory-message');
        if (targetName !== targetNameNative) {
            victoryMessage.textContent = `You found the town of ${targetName} | ${targetNameNative}`
        } else if (targetName === targetNameNative) {
            victoryMessage.textContent = `You found the town of ${targetName}`
        }
        
        // set target photo
        const targetPhoto = document.getElementById("found-target-photo");
        
        // get wiki info for the photo
        const wiki = targetWiki;
        try {
                const response = await fetch(
                `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(wiki)}`
                );
                if (!response.ok) return;
    
                const data = await response.json();
    
                if (data.originalimage) {
                    targetPhoto.src = data.originalimage.source;
                    targetPhoto.style.display = 'flex';
                } else if (data.thumbnail) {
                    targetPhoto.src = data.thumbnail.source;
                    targetPhoto.style.display = 'flex';
                } else {
                    targetPhoto.style.display = 'none';
                }
    
            } catch (err) {
                console.error('Wikipedia fetch failed:', err);
            }


        // append the trait cards grid to the victory screen
        const traitsGrid = document.getElementById('selected-traits-grid');
        if (!traitsGrid || !victoryScreen) return;
        const victoryCta = document.getElementById('victory-cta');
        victoryScreen.insertBefore(traitsGrid, victoryCta);

        const shareGuesses = document.getElementById('share-guesses-container');
        shareGuesses.innerHTML = '';

        guessGrids.forEach(grid => {
            shareGuesses.appendChild(grid)
        });

        shareGuesses.appendChild(
            createShareGrid(VICTORY_CARD_SETS.matched, 'solved-grid')
        );

        // needs to be one less than total guesses. 
        const remaining = 6 - guessGrids.length;

        for (let i = 0; i< remaining; i++) {
            shareGuesses.appendChild(
                createShareGrid(VICTORY_CARD_SETS.blank, 'unused-grid')
            );
        }

        return
    }

    async function triggerGameOverFailure() {
        // hide target-toolbar
        document.getElementById("target-toolbar").style.display = 'none';
        // show end screen darkener
        document.getElementById("end-screen-darkener").style.display = 'block';
        // show failure screen
        document.getElementById("failure-screen").style.display = 'flex';

        // Set failure message
        const failureMessage = document.getElementById('failure-message');
        if (targetName !== targetNameNative) {
            failureMessage.textContent = `The town of the day was ${targetName} | ${targetNameNative}`
        } else if (targetName === targetNameNative) {
            failureMessage.textContent = `The town of the day was ${targetName}`
        }
        
        
        // set target photo
        const targetPhoto = document.getElementById("target-photo");
        
        // get wiki info for the target photo
        const wiki = targetWiki;

        try {
            const response = await fetch(
            `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(wiki)}`
            );
            if (!response.ok) return;

            const data = await response.json();

            if (data.originalimage) {
                targetPhoto.src = data.originalimage.source;
                targetPhoto.style.display = 'flex';
            } else if (data.thumbnail) {
                targetPhoto.src = data.thumbnail.source;
                targetPhoto.style.display = 'flex';
            } else {
                targetPhoto.style.display = 'none';
            }

        } catch (err) {
            console.error('Wikipedia fetch failed:', err);
        }

        const playAgainBtn = document.getElementById("play-again-btn");
        playAgainBtn.addEventListener('click', () => {
            window.location.reload(true); // hard refresh the page
        })

        return
    }

</script>
